name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the published branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Needed to push the built site to the gh-pages branch.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publishes ./dist to the gh-pages branch that Pages serves from. The
      # action writes a .nojekyll file, without which Pages would run Jekyll
      # and drop the _astro/ directory — the site would load unstyled.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
